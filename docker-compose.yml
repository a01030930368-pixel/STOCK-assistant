# 기록(log) 파일이 PC에서 끝없이 커지지 않게 서비스마다 10MB × 3개까지만 남겨요.
x-logging: &logging
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  web:
    <<: *logging
    build: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # 하루 한 번 DB 전체를 backups 폴더에 저장하고 14일치를 남깁니다. 되살리는 법은 README의 "백업" 참고.
  backup:
    <<: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Asia/Seoul
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/lodestar-$$(date +%F).sql.gz
          if [ ! -s "$$f" ]; then
            if pg_dump --clean --if-exists -f /tmp/dump.sql && gzip -c /tmp/dump.sql > "$$f.tmp"; then
              mv "$$f.tmp" "$$f" && echo "backup saved $$f"
              find /backups -name 'lodestar-*.sql.gz' -mtime +14 -delete
            else
              rm -f "$$f.tmp"; echo "backup failed, retry in 1 hour"
            fi
            rm -f /tmp/dump.sql
          fi
          sleep 3600
        done
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *logging
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
